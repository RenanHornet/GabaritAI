
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <title>Login | GabaritAI</title>
</head>

<body class="bg-light">

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow border-0 rounded-4 p-4 w-100" style="max-width: 420px;">

            <div class="text-center mb-4">
                <h1 class="frase-gabaritai mt-2">GabaritAI</h1>
                <p class="text-secondary">
                    Correção inteligente de provas
                </p>
            </div>

            <h2 class="h4 text-center frase-dashboard mb-4">
                Bem-vindo de volta!
            </h2>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div
                    id="mensagemErro"
                    class="alert alert-danger d-none"
                    role="alert"
                >
                </div>

                <button
                    type="submit"
                    class="btn button-primary w-100 mt-3"
                    id="btnEntrar"
                >
                    Entrar
                </button>

            </form>

            <p class="text-center text-secondary small mt-4 mb-0">
                GabaritAI — MVP 0.1
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
