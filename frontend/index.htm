<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>GabaritAI</title>
</head>
<body>

    <header class="bg-primary">
        <h1 class="text-center mt-5 text-white">Bem-vindo ao GabaritAI</h1>
        <p class="text-center text-white mt-3">Correção inteligente de provas</p>
    </header>
    <main>
        <div class="container bg-success align-items-center mt-5 p-5 rounded">
            <form class="mt-5">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="Digite sua senha">
                </div>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-primary align-items-center" type="submit">entrar</button>
                </div>
                <div class="d-flex justify-content-center">
                    <button type="button" class="btn btn-primary align-items-center" onclick="testarAPI()">testar api</button>
                </div>   
            </form>
            <p id="resultadoAPI"></p>
        </div>
    </main>
    <footer class="bg-primary text-center text-white mt-5 p-3">
        <p>versão mvp 0.1</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
