
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão-resposta | GabaritAI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Barra superior -->
    <header class="navbar bg-primary navbar-dark px-3">
        <button
            class="btn btn-outline-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuLateral"
            aria-controls="menuLateral"
            aria-expanded="true"
            aria-label="Recolher ou expandir menu"
        >
            ☰
        </button>

        <a class="navbar-brand ms-3 me-auto" href="dashboard.html">
            GabaritAI
        </a>

        <span class="navbar-text text-white">
            Painel do professor
        </span>
    </header>

    <div class="d-flex">
        <!-- Menu lateral -->
        <aside
            class="menu-lateral collapse show"
            id="menuLateral"
        >
            <nav class="nav flex-column p-3">
                <span class="menu-titulo">
                    MENU PRINCIPAL
                </span>

                <a class="nav-link" href="dashboard.html">
                    Início
                </a>

                <a class="nav-link" href="alunos.html">
                    Alunos
                </a>

                <a class="nav-link" href="cadastro_prova.html">
                    Provas
                </a>

                <a class="nav-link" href="lista_questoes.html">
                    Questões e gabaritos
                </a>

                <a
                    class="nav-link active"
                    href="respostas.html"
                    aria-current="page"
                >
                    Respostas e correção
                </a>

                <a class="nav-link" href="ranking.html">
                    Ranking
                </a>
            </nav>
        </aside>

        <!-- Conteúdo principal -->
        <main class="flex-grow-1 p-4">
            <h1 class="titulo-card mb-4">Cartão-resposta</h1>

            <!-- Identificação da prova e do aluno -->
            <section class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="titulo-card mb-3">
                        Identificação
                    </h2>

                    <form id="formRespostas">
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label
                                    for="provaSelect"
                                    class="form-label fw-bold"
                                >
                                    Prova
                                </label>

                                <select
                                    id="provaSelect"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Selecione uma prova
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label
                                    for="turmaSelect"
                                    class="form-label fw-bold"
                                >
                                    Turma
                                </label>

                                <select
                                    id="turmaSelect"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Selecione uma turma
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label
                                    for="alunoSelect"
                                    class="form-label fw-bold"
                                >
                                    Aluno
                                </label>

                                <select
                                    id="alunoSelect"
                                    class="form-select"
                                    required
                                >
                                    <option value="">
                                        Selecione primeiro uma turma
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Alternativas -->
                        <section class="card shadow-sm mb-4">
                            <div class="card-body">
                                <h2 class="titulo-card mb-3">
                                    Alternativas marcadas
                                </h2>

                                <p class="text-muted">
                                    Selecione uma alternativa para cada questão.
                                </p>

                                <div id="listaQuestoes"></div>
                            </div>
                        </section>

                        <!-- Ações -->
                        <div class="d-flex flex-wrap gap-2">
                            <button
                                type="submit"
                                class="btn button-primary fw-bold"
                            >
                                Registrar respostas
                            </button>

                            <button
                                type="reset"
                                class="btn btn-outline-secondary"
                            >
                                Limpar formulário
                            </button>
                        </div>

                        <p
                            id="mensagem"
                            class="mt-3 mb-0"
                            role="status"
                        ></p>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/respostas.js"></script>
</body>
</html>
