
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão-resposta | GabaritAI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container py-4">
        <header class="mb-4">
            <h1>Cartão-resposta</h1>
            <p class="text-muted">
                Interface experimental para preenchimento manual das respostas.
            </p>
        </header>

        <form id="formRespostas">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="provaSelect" class="form-label">
                        Prova
                    </label>
                    <select id="provaSelect" class="form-select" required>
                        <option value="">Selecione uma prova</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="alunoSelect" class="form-label">
                        Aluno
                    </label>
                    <select id="alunoSelect" class="form-select" required>
                        <option value="">Selecione um aluno</option>
                    </select>
                </div>
            </div>

            <section class="card mb-4">
                <div class="card-header">
                    <h2 class="h5 mb-0">Alternativas marcadas</h2>
                </div>

                <div class="card-body">
                    <p class="text-muted">
                        Selecione uma alternativa para cada questão.
                    </p>

                    <div id="listaQuestoes"></div>
                </div>
            </section>

            <button type="submit" class="btn btn-primary">
                Registrar respostas
            </button>

            <button type="reset" class="btn btn-outline-secondary ms-2">
                Limpar formulário
            </button>

            <p id="mensagem" class="mt-3" role="status"></p>
        </form>
    </main>

    <script src="../js/respostas.js"></script>
</body>
</html>
