<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de provas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container mt-5 bg-info p-5 rounded">
        <div class="container mt-5">
            <h1 class="text-center mb-4">Cadastro de Provas</h1>
            <form id="cadastroProvaForm">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome da Prova</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite o nome da prova" required>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <textarea class="form-control" id="descricao" rows="3" placeholder="Digite a descrição da prova" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="data" class="form-label">Data da Prova</label>
                    <input type="date" class="form-control" id="data" required>
                </div>
                      <button type="submit" class="btn btn-primary">Cadastrar Prova</button>
            </form>
            <p id="resultadoCadastro"></p>
        </div>
        <div class="mt-5">
            <h3 class="text-center mb-3">Provas Cadastradas</h3>
            <div class="table-responsive">
                <table class="table table-striped table-hover bg-white rounded">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Descrição</th>
                            <th>Data de Aplicação</th>
                            <th>ID Professor</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProvasBody">
                        <!-- As linhas da tabela serão inseridas dinamicamente pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer class="bg-primary text-center text-white mt-5 p-3">
        <p>versão mvp 0.1</p>
    </footer> 
       
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
