
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alunos | GabaritAI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Barra superior -->
    <header class="navbar bg-primary navbar-dark px-3">
        <button
            class="btn btn-outline-light"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuLateral"
            aria-controls="menuLateral"
            aria-expanded="true"
            aria-label="Recolher ou expandir menu"
        >
            ☰
        </button>

        <a class="navbar-brand ms-3 me-auto" href="dashboard.html">
            GabaritAI
        </a>

        <span class="navbar-text text-white">
            Painel do professor
        </span>
    </header>

    <div class="d-flex">
        <!-- Menu lateral -->
        <aside
            class="menu-lateral collapse show"
            id="menuLateral"
        >
            <nav class="nav flex-column p-3">
                <span class="menu-titulo">
                    MENU PRINCIPAL
                </span>

                <a class="nav-link" href="dashboard.html">
                    Início
                </a>

                <a
                    class="nav-link active"
                    href="alunos.html"
                    aria-current="page"
                >
                    Alunos
                </a>

                <a class="nav-link" href="cadastro_prova.html">
                    Provas
                </a>

                <a class="nav-link" href="lista_questoes.html">
                    Questões e gabaritos
                </a>

                <a class="nav-link" href="respostas.html">
                    Respostas e correção
                </a>

                <a class="nav-link" href="ranking.html">
                    Ranking
                </a>
            </nav>
        </aside>

        <!-- Conteúdo da página -->
        <main class="flex-grow-1 p-3 p-md-4">
            <h1 class="frase-gabaritai">Gerenciamento de Alunos</h1>

            <!-- Cadastro -->
            <section class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="titulo-card">Cadastrar aluno</h2>

                    <form id="cadastroAlunoForm">
                        <div class="mb-3">
                            <label for="nome" class="sub-card-aluno">
                                Nome do Aluno
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                placeholder="Digite o nome do aluno"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="turma" class="sub-card-aluno">
                                Turma
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="turma"
                                placeholder="Digite a turma"
                                required
                            >
                        </div>

                        <div id="mensagemAlerta" class="mb-3"></div>

                        <button
                            type="submit"
                            class="button-primary btn"
                        >
                            Cadastrar Aluno
                        </button>
                    </form>
                </div>
            </section>

            <!-- Pesquisa -->
            <section class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="titulo-card">Pesquisar alunos</h2>

                    <form id="pesquisarAlunoForm">
                        <div class="mb-3">
                            <label for="pesquisa" class="sub-card-aluno">
                                Pesquisar por Turma
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="pesquisa"
                                placeholder="Digite o número da turma"
                                required
                            >
                        </div>

                        <button
                            type="button"
                            id="btnPesquisar"
                            class="button-primary btn"
                        >
                            Pesquisar
                        </button>

                        <button
                            type="button"
                            id="btnLimparPesquisa"
                            class="button-destaque btn btn-outline-secondary ms-2"
                        >
                            Ver Todos
                        </button>
                    </form>
                </div>
            </section>

            <!-- Listagem -->
            <section class="card shadow-sm">
                <div class="card-body">
                    <h2 class="titulo-card mb-3">Alunos cadastrados</h2>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="cabecalho-tabela">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Turma</th>
                                    <th class="text-center">Ações</th>
                                </tr>
                            </thead>

                            <tbody id="tabelaAlunosBody">
                                <!-- Preenchido via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/alunos.js"></script>
</body>
</html>
