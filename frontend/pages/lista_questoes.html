<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container mt-5 bg-info p-5 rounded">
        <h1 class="text-center mb-4">Questões da Prova</h1>
        <!-- Seleção da prova -->
        <div class="container mt-5">
            <h2 class="text-center mb-4">Selecione a prova</h2>
            <form id="seletorProvaForm">
                <div class="mb-3">
                    <label for="provaSelect" class="form-label">
                        Prova
                    </label>
                    <select class="form-select" id="provaSelect">
                        <option value="">Selecione uma prova</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    Selecionar Prova
                </button>
            </form>
        </div>
        <!-- Tabela de questões -->
        <div class="container mt-5">
            <div class="d-flex justify-content-between align-items-end mb-3" id="adicionaQuestao">
                <h2 class="mb-0">Questões</h2>
                <form id="cadastroQuestaoForm" class="row g-2 align-items-end">
                    <div class="col-auto">
                        <label for="numeroQuestao" class="form-label mb-1">Nº Questão</label>
                        <input type="number" class="form-control" id="numeroQuestao" min="1" placeholder="Ex: 1" required>
                    </div>
                    <div class="col-auto">
                        <label for="alternativaCorreta" class="form-label mb-1">Resposta correta</label>
                        <select class="form-select" id="alternativaCorreta" required>
                            <option value="">Selecione...</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-success">Salvar questão</button>
                    </div>
                </form>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover bg-white rounded">
                    <thead class="table-dark">
                        <tr>
                            <th>Nº</th>
                            <th>Alternativa correta</th>
                            <th>Professor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaQuestoesBody">
                        <!-- Questões serão inseridas pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer class="bg-primary text-center text-white mt-5 p-3">
        <p>versão mvp 0.1</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/questoes.js"></script>
</body>

</html>
